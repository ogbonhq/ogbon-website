# On every push and PR to dev/main: build the site image, run it and check it (tests/smoke.sh). On a
# push, the image goes to GHCR as ghcr.io/ogbonhq/ogbon-website:<branch> and :sha-<short>. The web
# VM pulls :main every 5 minutes (deploy/ogbon-web-update.sh), so a push to main goes live.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ogbon-website:test
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test
        run: |
          docker run -d --name site --network host --read-only --tmpfs /tmp --tmpfs /var/cache/nginx ogbon-website:test
          for _ in $(seq 30); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' site)" = healthy ] && break
            sleep 1
          done
          docker inspect --format 'health: {{.State.Health.Status}}' site
          bash tests/smoke.sh
      - name: Container logs
        if: failure()
        run: docker logs site
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: github.event_name == 'push'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
      - name: Push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
