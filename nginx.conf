# ogbon.com behind Cloudflare: the cloudflared tunnel on the same machine sends requests to
# 127.0.0.1:8092 with the visitor's Host header; Cloudflare terminates TLS. The container runs on
# the host network and `reuseport` lets a new one start next to the old one on the same port
# (deploy/ogbon-web-update.sh). Reproduces .htaccess: pages revalidate on every visit, everything
# else is cached for 7 days (styles.css and script.js are linked with ?v=, bump it when they
# change), www -> apex, the removed team, careers, compare and research pages -> home.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  types {
    application/manifest+json webmanifest;
  }
  default_type application/octet-stream;
  charset utf-8;
  charset_types text/css text/plain text/xml application/javascript application/manifest+json image/svg+xml;

  access_log /dev/stdout combined;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  absolute_redirect off;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/css text/plain text/xml application/xml application/javascript application/json
             application/manifest+json image/svg+xml image/x-icon;

  map $uri $cache_control {
    ~\.(html|xml|txt|webmanifest)$  "no-cache";
    default                         "public, max-age=604800";
  }

  # One canonical host: www.ogbon.com redirects to ogbon.com (same path).
  server {
    listen 127.0.0.1:8092;
    server_name www.ogbon.com;
    return 301 https://ogbon.com$request_uri;
  }

  server {
    listen 127.0.0.1:8092 reuseport default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $cache_control always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    error_page 404 /404.html;

    # The team, careers, compare and research pages were removed.
    location ~ ^/(team|careers|compare|research)(\.html)?$ {
      return 301 /;
    }

    # One address per page: /pricing.html redirects to /pricing, the canonical URL. (Not index.html:
    # the index directive serves / through it.)
    location ~ ^/(report|how-it-works|ogbon-1|cover|pentesting|pricing|incident|about|privacy|terms)\.html$ {
      return 301 /$1$is_args$args;
    }

    location / {
      try_files $uri $uri.html $uri/ =404;
    }

    location = /404.html {
      internal;
    }
  }
}
